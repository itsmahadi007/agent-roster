name: package
# Builds downloadable copies to try on another machine. Run it from the Actions tab.
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: app
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo build --release -p agent-roster
      - run: cargo tauri build --bundles nsis
        working-directory: app/src-tauri
      - name: Installer installs where `roster ui` looks for it
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Agent Roster\agent-roster-app.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Agent Roster'); throw "missing $exe" }
          "installed: $exe"
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item target/release/bundle/nsis/*-setup.exe out/
          Copy-Item target/release/roster.exe out/
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: agent-roster-windows
          path: out/
