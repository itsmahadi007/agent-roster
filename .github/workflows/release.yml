name: release
# Builds Agent Roster for every platform and publishes a GitHub Release.
# Runs when a version tag like v0.2.0 is pushed, or by hand from the Actions tab (build only).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Which platforms this release builds. `.github/release-platforms` (one word: mac, windows or
  # linux per line) limits it; without that file every platform is built.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      only: ${{ steps.m.outputs.only }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          all='[
            {"slug":"mac-apple-silicon","os":"macos-latest","target":"aarch64-apple-darwin","bundles":"app,dmg"},
            {"slug":"mac-intel","os":"macos-latest","target":"x86_64-apple-darwin","bundles":"app,dmg"},
            {"slug":"windows-x64","os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis"},
            {"slug":"windows-arm64","os":"windows-latest","target":"aarch64-pc-windows-msvc","bundles":"nsis"},
            {"slug":"linux-x64","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","bundles":"appimage,deb"}]'
          only=""
          [ -f .github/release-platforms ] && only=$(grep -Eo '^(mac|windows|linux)' .github/release-platforms | sort -u | paste -sd, -)
          if [ -z "$only" ]; then m="$all"; else
            m=$(echo "$all" | jq -c --arg o "$only" '[.[] | select(.slug | split("-")[0] as $p | ($o | split(",") | index($p)))]')
          fi
          echo "matrix={\"include\":$(echo "$m" | jq -c .)}" >> "$GITHUB_OUTPUT"
          echo "only=$only" >> "$GITHUB_OUTPUT"
          echo "platforms: ${only:-all}"

  build:
    name: ${{ matrix.slug }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential patchelf libfuse2 file
      - run: npm ci
        working-directory: app
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Build roster and put it where the app bundle picks it up
        run: |
          cargo build --release -p agent-roster --target ${{ matrix.target }}
          mkdir -p app/src-tauri/binaries
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/roster$ext" "app/src-tauri/binaries/roster-${{ matrix.target }}$ext"
      - name: Build the app
        working-directory: app/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config tauri.release.conf.json
      - name: Collect files (fixed names, so "latest" download links never change)
        run: |
          s=${{ matrix.slug }}
          r=target/${{ matrix.target }}/release
          b=$r/bundle
          mkdir out
          case $s in
            mac-*)
              cp "$(ls $b/dmg/*.dmg | head -1)" "out/Agent-Roster-$s.dmg"
              cp "$b/macos/Agent Roster.app.tar.gz" "out/Agent-Roster-$s.app.tar.gz"
              cp "$b/macos/Agent Roster.app.tar.gz.sig" "out/Agent-Roster-$s.app.tar.gz.sig"
              test -x "$b/macos/Agent Roster.app/Contents/MacOS/roster"
              tar czf "out/roster-$s.tar.gz" -C $r roster ;;
            windows-*)
              setup=$(ls $b/nsis/*-setup.exe | head -1)
              cp "$setup" "out/Agent-Roster-$s-setup.exe"
              cp "$setup.sig" "out/Agent-Roster-$s-setup.exe.sig"
              cp $r/roster.exe "out/roster-$s.exe" ;;
            linux-*)
              img=$(ls $b/appimage/*.AppImage | head -1)
              cp "$img" "out/Agent-Roster-$s.AppImage"
              cp "$img.sig" "out/Agent-Roster-$s.AppImage.sig"
              cp "$(ls $b/deb/*.deb | head -1)" "out/Agent-Roster-$s.deb"
              tar czf "out/roster-$s.tar.gz" -C $r roster ;;
          esac
          ls -la out
      - name: Windows installer puts the app and roster where the app looks
        if: matrix.slug == 'windows-x64'
        shell: pwsh
        run: |
          Start-Process (Resolve-Path out/Agent-Roster-windows-x64-setup.exe) -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Agent Roster'
          foreach ($f in 'agent-roster-app.exe', 'roster.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { Get-ChildItem $dir; throw "missing $f" }
          }
          & (Join-Path $dir 'roster.exe') --help | Select-Object -First 1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}
          path: out/

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then echo "Not a tag: built only, nothing published."; exit 0; fi
          v="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          # latest.json is what installed apps read to find and verify an update. Only the
          # platforms built here go in it: a platform left out keeps its installed version.
          platforms='{}'
          for pair in darwin-aarch64:Agent-Roster-mac-apple-silicon.app.tar.gz darwin-x86_64:Agent-Roster-mac-intel.app.tar.gz \
                      windows-x86_64:Agent-Roster-windows-x64-setup.exe windows-aarch64:Agent-Roster-windows-arm64-setup.exe \
                      linux-x86_64:Agent-Roster-linux-x64.AppImage; do
            key=${pair%%:*}; f=${pair#*:}
            [ -f "dist/$f.sig" ] || continue
            platforms=$(echo "$platforms" | jq --arg k "$key" --arg url "$base/$f" --arg sig "$(cat "dist/$f.sig")" '. + {($k): {url: $url, signature: $sig}}')
          done
          jq -n --arg v "$v" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
            '{version: $v, notes: "See the release page for what changed.", pub_date: $date, platforms: $p}' > dist/latest.json
          cat dist/latest.json
          sed "s/{{VERSION}}/$v/g" .github/release-notes.md > notes.md
          only="${{ needs.plan.outputs.only }}"
          if [ -n "$only" ]; then
            # Platforms not built this time keep working download links: carry the previous
            # release's files over (they stay out of latest.json, so nobody is updated to them).
            prev=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
            if [ -n "$prev" ] && [ "$prev" != "$TAG" ]; then
              mkdir -p carry
              for p in mac linux; do
                case ",$only," in *",$p,"*) continue ;; esac
                gh release download "$prev" -D carry -p "Agent-Roster-$p-*" -p "roster-$p-*" || true
              done
              for f in carry/*; do [ -e "$f" ] && [ ! -e "dist/$(basename "$f")" ] && cp "$f" dist/; done
              { printf '> **This release is for %s only.** Other systems stay on %s for now (their downloads below are %s) and get these changes in the next release.\n\n' \
                  "$(echo "$only" | sed 's/mac/macOS/; s/windows/Windows/; s/linux/Linux/; s/,/ and /g')" "$prev" "$prev"; cat notes.md; } > notes2.md
              mv notes2.md notes.md
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "Agent Roster $TAG" --notes-file notes.md
          fi
