[workspace]
resolver = "3"
members = ["crates/roster-core", "crates/roster-cli", "app/src-tauri"]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"
authors = ["Mahadi Hassan"]
repository = "https://github.com/itsmahadi007/agent-roster"
homepage = "https://agentroster.mahadihassan.com"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.2.1"
sha2 = "0.11.1"
hex = "0.4.3"
which = "8.0.6"
anstream = "1.0.0"
anstyle = "1.0.14"
rand = "0.10.3"
libc = "0.2"
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.27.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
winreg = "0.56.0"
jiff = "0.2.41"
url = "2.5.8"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO"] }
roster-core = { path = "crates/roster-core" }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-build = { version = "2.7.4", features = [] }
